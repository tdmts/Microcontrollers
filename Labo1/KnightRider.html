<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knight rider</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="https://tdmts.github.io/OrionContent/orion.css">
    <script src="https://tdmts.github.io/OrionContent/orion.js"></script>
</head>
<body>
<div class="container">
    <h1>Knight rider</h1>
    <p class="lead">Verbind 4 led's met pinnen 3 tot en met 6 en programmeer een looplicht maar dan met een knightrider effect. Frequentie is opnieuw 1Hz. Wat ga je moeten doen met de delay?</p>

    <div class="video-container">
        <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube.com/embed/1F55clpCmmc?wmode=opaque&amp;rel=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

    <hr>

    <h2 id="indienen">Indienen</h2>
    <p>Sla je oefening op.</p>

    <div class="info-box evaluation">
        <div class="info-title evaluation">Checklist</div>
        <p>Overloop volgende checklist om je oefening zelf te evalueren:</p>
        <ul class="checklist">
            <li><label><input type="checkbox" class="form-check-input me-2"> Alle 4 leds (pinnen 3 t.e.m. 6) lopen heen en weer (knightrider-effect)</label></li>
            <li><label><input type="checkbox" class="form-check-input me-2"> Frequentie is 1Hz</label></li>
            <li><label><input type="checkbox" class="form-check-input me-2"> Geen errors of warnings in de log</label></li>
        </ul>
    </div>
</div>

<script src="https://tdmts.github.io/Microcontrollers/exercises.js"></script>
<script src="https://tdmts.github.io/Microcontrollers/checklist-sync.js"></script>
<script>
    initChecklistSync(LAB_EXERCISES.labo1);
</script>
</body>
</html>
