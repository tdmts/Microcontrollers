<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dubbel 7 segment met teller</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="https://tdmts.github.io/OrionContent/orion.css">
    <script src="https://tdmts.github.io/OrionContent/orion.js"></script>
</head>
<body>
<div class="container">
    <h1>Dubbel 7 segment met teller</h1>
    <p class="lead">Maak met een dubbel 7 segment een 00 tot 99 teller door gebruik te maken van multiplexing. Pin10 bepaalt welk van beide displays actief is.</p>

    <hr>

    <h2 id="indienen">Indienen</h2>
    <p>Sla je oefening op.</p>

    <div class="info-box evaluation">
        <div class="info-title evaluation">Checklist</div>
        <p>Overloop volgende checklist om je oefening zelf te evalueren:</p>
        <ul class="checklist">
            <li><label><input type="checkbox" class="form-check-input me-2"> Teller telt doorlopend van 00 tot 99</label></li>
            <li><label><input type="checkbox" class="form-check-input me-2"> Beide displays worden via multiplexing aangestuurd</label></li>
            <li><label><input type="checkbox" class="form-check-input me-2"> Pin10 bepaalt welk display actief is</label></li>
            <li><label><input type="checkbox" class="form-check-input me-2"> Geen errors of warnings in de log</label></li>
        </ul>
    </div>
</div>

<script src="https://tdmts.github.io/Microcontrollers/back-link.js"></script>
<script src="https://tdmts.github.io/Microcontrollers/exercises.js"></script>
<script src="https://tdmts.github.io/Microcontrollers/checklist-sync.js"></script>
<script>
    initChecklistSync(LAB_EXERCISES.labo1);
</script>
</body>
</html>
